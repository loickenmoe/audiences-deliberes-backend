services:
  grade-app:
    image: audiences-app
    build: .
    env_file: .env
    environment:
      - PORT=${BACKEND_PORT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    ports:
      - "8888:${BACKEND_PORT:-8888}"
    depends_on:
      - minio
    networks:
      - default

  minio:
    image: minio/minio
    env_file: .env
    ports:
      - "9000:${MINIO_API_PORT:-9000}"
      - "9001:${MINIO_CONSOLE_PORT:-9001}"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --address ":9000" --console-address ":9001"
    networks:
      - default


networks:
  default:
    driver: bridge
    name: grade-network

volumes:
  minio_data: