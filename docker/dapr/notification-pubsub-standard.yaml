# Dapr component for the STANDARD topic of the Notification Engine.
#
# The engine guide only ships the CRITICAL topic component (`notification-pubsub`). This one
# follows it with only the name changed: same broker, same options. STANDARD is the target
# topic because it catches up on its messages after an outage, whereas CRITICAL drops them.
#
# `brokers` is the address of the target environment (DEV is the only one reachable from
# workstations). It comes from .env, never from this file.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: notification-pubsub-standard
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "{{KAFKA_BOOTSTRAP_SERVERS}}"
    - name: authType
      value: "none"
    - name: disableTls
      value: "true"
    - name: maxMessageBytes
      value: "1048576"
    # The service only produces to this topic. The consumer group is declared because Dapr
    # requires it.
    - name: consumerGroup
      value: "audience-deliberer"
