# Textes des notifications externes (Notification Engine) - NOTIFICATION_ENGINE_PLAN.md, D3 et D18.
#
# Versionnés ici, jamais dans l'Engine. Deux entrées par événement :
#   .titre   nom court de l'événement (objet du courriel, SMS, WhatsApp)
#   .phrase  une phrase complète, volontairement générique
#
# RÈGLE (D18) : aucun nom de client ou de débiteur, aucun montant, aucun motif, aucun code interne
# (RG-..., Q-...), aucun marqueur technique. Ces textes ne reçoivent d'ailleurs aucune donnée métier :
# seules la référence du dossier et un lien vers l'application sont ajoutées, selon le canal.
# Une phrase générique est voulue : un même type couvre plusieurs situations (une « suppression de
# document » est tour à tour une demande, un arbitrage ou une relance) ; le détail se lit dans
# l'application.
#
# Encodage UTF-8 (lu comme tel par RedacteurNotification).

