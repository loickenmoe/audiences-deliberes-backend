spring.config.import=optional:file:.env[.properties]

spring.application.name=audiences-app
server.port=${BACKEND_PORT}

# Database Configuration
# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Minio SDK Configuration

minio.url=${MINIO_API_URL}
minio.access-key=${MINIO_USERNAME}
minio.secret-key=${MINIO_PASSWORD}
minio.bucket-name=${MINIO_PROJECT_NAME}

# JPA/Hibernate Configuration
# Le schéma est désormais géré exclusivement par Flyway (voir src/main/resources/db/migration) ;
# Hibernate se contente de valider que les entités correspondent au schéma migré, il ne le modifie
# jamais lui-même. JPA_ACTION (.env) n'est plus utilisé.
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Javamail configuration
#spring.mail.host=${MAIL_HOST}
#spring.mail.port=${MAIL_PORT}
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.protocol=${MAIL_PROTOCOL}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.default-encoding=UTF-8

# Correction SSL pour Gmail
#spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
#spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true

api.prefix=/api/v1

# Module alerte (M5) — RG-ALR-02 : intervalle de vérification du seuil CHARGE_MAX_AVOCAT (ms).
alerte.charge-max-avocat.interval-ms=${ALERTE_CHARGE_MAX_AVOCAT_INTERVAL_MS:3600000}

# Module audience (M6) — RG-AUD-03 : rappels J-7/J-3/J-1 (cron quotidien) et échéances d'alarme (ms).
audience.rappel.cron=${AUDIENCE_RAPPEL_CRON:0 0 6 * * *}
audience.alarme-echeance.interval-ms=${AUDIENCE_ALARME_ECHEANCE_INTERVAL_MS:3600000}

# Module delibere (M7) — RG-DEL-02 : suivi quotidien du délai de recours (bascule CLOTURE).
delibere.recours.cron=${DELIBERE_RECOURS_CRON:0 0 6 * * *}

# Module ged (M8) — UC-GED-03 alt. 6-a : relance horaire des demandes de suppression en attente
# depuis plus de 72 h (la vérification est horaire, le délai de 72 h reste fixe).
ged.relance-suppression.cron=${GED_RELANCE_SUPPRESSION_CRON:0 0 * * * *}

# Module frais (M16, Q-83) — CONF04 : relance horaire des validations conjointes restées sans suite
# au-delà de DELAI_VALIDATION_CONJOINTE jours (paramètre modifiable par le DJ).
frais.relance-validation-conjointe.cron=${FRAIS_RELANCE_CONJOINTE_CRON:0 0 * * * *}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Notification Engine de la banque (SMS, courriel, WhatsApp, Teams). Désactivé par défaut : les
# notifications externes sont alors seulement écrites dans le journal. Le code et le secret du
# compte de service viennent du .env (jamais versionné).
notification.engine.actif=${NOTIFICATION_ENGINE_ACTIF:false}
notification.engine.code-service=${NOTIFICATION_ENGINE_CODE_SERVICE:}
notification.engine.jwt-secret=${NOTIFICATION_ENGINE_JWT_SECRET:}
# Adresse de l'application insérée dans les notifications externes (liens vers un dossier, le portail).
notification.lien-application=${NOTIFICATION_LIEN_APPLICATION:http://localhost:3000}

# Dispatcher des notifications externes : cadence du passage sur la file, nombre de tentatives,
# âge au-delà duquel une notification en attente est abandonnée plutôt qu'envoyée.
notification.engine.dispatcher.interval-ms=${NOTIFICATION_DISPATCHER_INTERVAL_MS:60000}
notification.engine.tentatives-max=${NOTIFICATION_TENTATIVES_MAX:5}
notification.engine.age-max=${NOTIFICATION_AGE_MAX:2h}

# Redirection hors production (bac à sable) : tout message part vers ces destinataires de test.
notification.engine.redirection.actif=${NOTIFICATION_REDIRECTION_ACTIVE:true}
notification.engine.redirection.courriel-interne=${NOTIFICATION_REDIRECTION_COURRIEL_INTERNE:}
notification.engine.redirection.courriel-personnel=${NOTIFICATION_REDIRECTION_COURRIEL_PERSONNEL:}
notification.engine.redirection.telephone=${NOTIFICATION_REDIRECTION_TELEPHONE:}

# Transport vers le Notification Engine : DAPR (voie documentée), KAFKA (repli direct) ou JOURNAL.
notification.engine.transport.type=${NOTIFICATION_TRANSPORT:DAPR}
notification.engine.transport.topic=${NOTIFICATION_TOPIC:notification-send-standard}
notification.engine.transport.pubsub=${NOTIFICATION_PUBSUB:notification-pubsub-standard}
notification.engine.transport.dapr-url=${NOTIFICATION_DAPR_URL:http://localhost:3500}
# Courtier Kafka, utile seulement en transport KAFKA (laisser vide sinon).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}

# Suivi de la délivrance : délai au-delà duquel un envoi publié sans accusé est dit « sans retour »,
# et adresse publique de l'application pour les rappels du moteur (vide = rappels désactivés).
notification.engine.delai-accuse=${NOTIFICATION_DELAI_ACCUSE:15m}
notification.engine.callback-base-url=${NOTIFICATION_CALLBACK_BASE_URL:}
# Le moteur publie-t-il ses accusés ? Faux par défaut : ses topics de suivi se sont révélés vides,
# tous services confondus (Q-121). À rebasculer quand l'administrateur confirmera qu'ils sont alimentés.
notification.engine.suivi-accuses=${NOTIFICATION_SUIVI_ACCUSES:false}
