services:
  audiences-app:
    image: audiences-app
    build: .
    env_file: .env
    environment:
      - PORT=${BACKEND_PORT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    ports:
      - "8080:${BACKEND_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - default

  # Dapr sidecar: documented path to publish to the Notification Engine.
  # Only used by the `notifications` profile: docker compose --profile notifications up -d
  # Without it the application starts normally, and the KAFKA transport remains as a fallback.
  dapr:
    image: daprio/daprd:1.14.4
    profiles: ["notifications"]
    command:
      - "./daprd"
      - "--app-id=audience-deliberer"
      - "--app-port=8080"
      - "--dapr-http-port=3500"
      - "--resources-path=/composants"
      - "--log-level=info"
    volumes:
      - ./docker/dapr:/composants:ro
    # The sidecar shares the application's network stack: it is reached on localhost:3500,
    # like a Kubernetes sidecar.
    network_mode: "service:audiences-app"
    depends_on:
      - audiences-app
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audiences_db}
      POSTGRES_USER: ${POSTGRES_USER:-audiences_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiences_pass}
    ports:
      # Configurable host port: 5432 is often taken by a native PostgreSQL install
      # on Windows workstations (e.g. service "postgresql-x64-17"). The internal Docker
      # network port (used by Keycloak via KC_DB_URL below) stays 5432.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Also creates the application database "audiences_app" on first volume start,
      # next to the Keycloak database (POSTGRES_DB); both share the same local instance.
      - ./docker/postgres/init-app-db.sql:/docker-entrypoint-initdb.d/init-app-db.sql:ro
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audiences_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-audiences_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-audiences_pass}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      # The Host header is required: without it Keycloak's hostname provider throws a
      # NullPointerException (HttpServerRequest.authority() == null) and the check always fails,
      # even when the realm responds correctly.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/audiences-realm HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q 'audiences-realm'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s

  minio:
    image: minio/minio
    env_file: .env
    ports:
      - "9000:${MINIO_API_PORT:-9000}"
      - "9001:${MINIO_CONSOLE_PORT:-9001}"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --address ":9000" --console-address ":9001"
    networks:
      - default

networks:
  default:
    driver: bridge
    name: audiences-network

volumes:
  postgres_data:
  minio_data:
