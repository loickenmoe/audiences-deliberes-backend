services:
  audiences-app:
    image: audiences-app
    build: .
    env_file: .env
    environment:
      - PORT=${BACKEND_PORT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    ports:
      - "8888:${BACKEND_PORT:-8888}"
    depends_on:
      keycloak:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - default

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audiences_db}
      POSTGRES_USER: ${POSTGRES_USER:-audiences_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiences_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-audiences_db}
      KC_DB_USERNAME: ${POSTGRES_USER:-audiences_user}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-audiences_pass}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/audiences-realm HTTP/1.0\r\n\r\n' >&3 && cat <&3 | grep -q 'audiences-realm'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 60s

  minio:
    image: minio/minio
    env_file: .env
    ports:
      - "9000:${MINIO_API_PORT:-9000}"
      - "9001:${MINIO_CONSOLE_PORT:-9001}"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USERNAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --address ":9000" --console-address ":9001"
    networks:
      - default

networks:
  default:
    driver: bridge
    name: audiences-network

volumes:
  postgres_data:
  minio_data:
