spring.config.import=optional:file:.env[.properties]

spring.application.name=audiences-app
server.port=${BACKEND_PORT}

# Database Configuration
# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Minio SDK Configuration

minio.url=${MINIO_API_URL}
minio.access-key=${MINIO_USERNAME}
minio.secret-key=${MINIO_PASSWORD}
minio.bucket-name=${MINIO_PROJECT_NAME}

# JPA/Hibernate Configuration
# The schema is managed by Flyway only (src/main/resources/db/migration);
# Hibernate only validates that the entities match the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Javamail configuration
#spring.mail.host=${MAIL_HOST}
#spring.mail.port=${MAIL_PORT}
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.protocol=${MAIL_PROTOCOL}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.default-encoding=UTF-8

# SSL settings for Gmail
#spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
#spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true

api.prefix=/api/v1

# Alerts - RG-ALR-02: check interval of the CHARGE_MAX_AVOCAT threshold (ms).
alerte.charge-max-avocat.interval-ms=${ALERTE_CHARGE_MAX_AVOCAT_INTERVAL_MS:3600000}

# Hearings - RG-AUD-03: D-7/D-3/D-1 reminders (daily cron) and alarm deadlines (ms).
audience.rappel.cron=${AUDIENCE_RAPPEL_CRON:0 0 6 * * *}
audience.alarme-echeance.interval-ms=${AUDIENCE_ALARME_ECHEANCE_INTERVAL_MS:3600000}

# Deliberations - RG-DEL-02: daily check of the appeal deadline (switch to CLOTURE).
delibere.recours.cron=${DELIBERE_RECOURS_CRON:0 0 6 * * *}

# Document management - UC-GED-03 alt. 6-a: hourly reminder for deletion requests pending
# for more than 72 h (the check runs hourly, the 72 h delay is fixed).
ged.relance-suppression.cron=${GED_RELANCE_SUPPRESSION_CRON:0 0 * * * *}

# Fees - CONF04: hourly reminder for joint validations left unanswered
# beyond DELAI_VALIDATION_CONJOINTE days (setting editable by the legal director).
frais.relance-validation-conjointe.cron=${FRAIS_RELANCE_CONJOINTE_CRON:0 0 * * * *}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}

# Bank Notification Engine (SMS, email, WhatsApp, Teams). Disabled by default: external
# notifications are then only written to the log. The service account code and secret
# come from .env (never committed).
notification.engine.actif=${NOTIFICATION_ENGINE_ACTIF:false}
notification.engine.code-service=${NOTIFICATION_ENGINE_CODE_SERVICE:}
notification.engine.jwt-secret=${NOTIFICATION_ENGINE_JWT_SECRET:}
# Application URL used in external notifications (links to a case, to the portal).
notification.lien-application=${NOTIFICATION_LIEN_APPLICATION:http://localhost:3000}

# External notification dispatcher: queue polling rate, number of attempts,
# and age beyond which a pending notification is dropped instead of sent.
notification.engine.dispatcher.interval-ms=${NOTIFICATION_DISPATCHER_INTERVAL_MS:60000}
notification.engine.tentatives-max=${NOTIFICATION_TENTATIVES_MAX:5}
notification.engine.age-max=${NOTIFICATION_AGE_MAX:2h}

# Non-production redirection (sandbox): every message goes to these test recipients.
notification.engine.redirection.actif=${NOTIFICATION_REDIRECTION_ACTIVE:true}
notification.engine.redirection.courriel-interne=${NOTIFICATION_REDIRECTION_COURRIEL_INTERNE:}
notification.engine.redirection.courriel-personnel=${NOTIFICATION_REDIRECTION_COURRIEL_PERSONNEL:}
notification.engine.redirection.telephone=${NOTIFICATION_REDIRECTION_TELEPHONE:}

# Transport to the Notification Engine: DAPR (documented path), KAFKA (direct fallback) or JOURNAL.
notification.engine.transport.type=${NOTIFICATION_TRANSPORT:DAPR}
notification.engine.transport.topic=${NOTIFICATION_TOPIC:notification-send-standard}
notification.engine.transport.pubsub=${NOTIFICATION_PUBSUB:notification-pubsub-standard}
notification.engine.transport.dapr-url=${NOTIFICATION_DAPR_URL:http://localhost:3500}
# Kafka broker, only used with the KAFKA transport (leave empty otherwise).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}

# Delivery tracking: delay after which a published message without acknowledgement is marked
# "no feedback", and public application URL for engine callbacks (empty = callbacks disabled).
notification.engine.delai-accuse=${NOTIFICATION_DELAI_ACCUSE:15m}
notification.engine.callback-base-url=${NOTIFICATION_CALLBACK_BASE_URL:}
# Does the engine publish acknowledgements? False by default: its tracking topics were found empty
# for every service. Switch it on once the administrator confirms they are populated.
notification.engine.suivi-accuses=${NOTIFICATION_SUIVI_ACCUSES:false}
