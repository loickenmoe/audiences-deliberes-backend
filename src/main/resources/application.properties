spring.config.import=optional:file:.env[.properties]

spring.application.name=audiences-app
server.port=${BACKEND_PORT}

# Database Configuration
# PostgreSQL Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Minio SDK Configuration

minio.url=${MINIO_API_URL}
minio.access-key=${MINIO_USERNAME}
minio.secret-key=${MINIO_PASSWORD}
minio.bucket-name=${MINIO_PROJECT_NAME}

# JPA/Hibernate Configuration
# Le schéma est désormais géré exclusivement par Flyway (voir src/main/resources/db/migration) ;
# Hibernate se contente de valider que les entités correspondent au schéma migré, il ne le modifie
# jamais lui-même. JPA_ACTION (.env) n'est plus utilisé.
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Keycloak / OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Javamail configuration
#spring.mail.host=${MAIL_HOST}
#spring.mail.port=${MAIL_PORT}
#spring.mail.username=${MAIL_USERNAME}
#spring.mail.password=${MAIL_PASSWORD}
#spring.mail.protocol=${MAIL_PROTOCOL}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.default-encoding=UTF-8

# Correction SSL pour Gmail
#spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
#spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.starttls.required=true

api.prefix=/api/v1

# Module alerte (M5) — RG-ALR-02 : intervalle de vérification du seuil CHARGE_MAX_AVOCAT (ms).
alerte.charge-max-avocat.interval-ms=${ALERTE_CHARGE_MAX_AVOCAT_INTERVAL_MS:3600000}

# Module audience (M6) — RG-AUD-03 : rappels J-7/J-3/J-1 (cron quotidien) et échéances d'alarme (ms).
audience.rappel.cron=${AUDIENCE_RAPPEL_CRON:0 0 6 * * *}
audience.alarme-echeance.interval-ms=${AUDIENCE_ALARME_ECHEANCE_INTERVAL_MS:3600000}

# Module delibere (M7) — RG-DEL-02 : suivi quotidien du délai de recours (bascule CLOTURE).
delibere.recours.cron=${DELIBERE_RECOURS_CRON:0 0 6 * * *}

# Module ged (M8) — UC-GED-03 alt. 6-a : relance horaire des demandes de suppression en attente
# depuis plus de 72 h (la vérification est horaire, le délai de 72 h reste fixe).
ged.relance-suppression.cron=${GED_RELANCE_SUPPRESSION_CRON:0 0 * * * *}

# Module frais (M16, Q-83) — CONF04 : relance horaire des validations conjointes restées sans suite
# au-delà de DELAI_VALIDATION_CONJOINTE jours (paramètre modifiable par le DJ).
frais.relance-validation-conjointe.cron=${FRAIS_RELANCE_CONJOINTE_CRON:0 0 * * * *}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
